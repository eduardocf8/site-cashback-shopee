<fieldset class="notas-ambiente">
  <legend>Onde emitir</legend>
  <div class="segmentado" role="radiogroup">
    <label><input type="radio" name="ambiente" value="2" checked><span>Teste</span></label>
    <label><input type="radio" name="ambiente" value="1"><span>De verdade</span></label>
  </div>
  <span class="ajuda suave pequeno" data-ambiente="2">Teste: no ambiente de testes do governo, sem valor fiscal{% if com_email %} e sem e-mail para ninguém{% endif %}. Bom para conferir antes.</span>
  <span class="ajuda suave pequeno" data-ambiente="1" hidden>De verdade: {% if com_email %}notas válidas, enviadas por e-mail para cada vendedor{% else %}nota válida, com valor fiscal{% endif %}.</span>
</fieldset>
