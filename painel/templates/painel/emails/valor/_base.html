<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only">
<title>Appfiliado</title>
<style>:root { color-scheme: light only; supported-color-schemes: light only; }</style></head>
<body style="margin:0;padding:0;background:#F6F3EA;font-family:Arial,Helvetica,sans-serif;color:#1C2B23;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background:#F6F3EA;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;">
  <tr><td style="background:#1F3A2E;border-radius:14px 14px 0 0;padding:18px 24px;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td width="32" height="32" valign="middle" style="width:32px;height:32px;"><img src="{{ url_logo }}" width="32" height="32" alt="Appfiliado" style="display:block;width:32px;height:32px;border:0;"></td>
      <td style="padding-left:10px;color:#F6F3EA;font-size:16px;font-weight:bold;">Appfiliado</td>
    </tr></table>
  </td></tr>
  <tr><td style="background:#FFFFFF;padding:26px 24px 22px;border:1px solid #E5DFCD;border-top:none;border-radius:0 0 14px 14px;">
<!--corpo-->
    <p style="{{ p }}">Fala{% if nome %}, {{ nome }}{% endif %}!</p>
{{ corpo|safe }}
    <p style="{{ p }}margin-top:20px;">Abraço,<br><strong>Eduardo</strong><br><span style="color:#5C6A61;">Fundador do Appfiliado</span></p>
<!--/corpo-->
  </td></tr>
  <tr><td style="padding:16px 8px;text-align:center;font-size:12px;line-height:1.5;color:#7A867E;">
    Você recebe estas dicas porque assinou o Appfiliado. É só responder este e-mail pra falar comigo.<br>
    <a href="{{ url_parar }}" style="color:#7A867E;">Não quero mais receber dicas</a>
  </td></tr>
</table>
</td></tr></table>
</body></html>
