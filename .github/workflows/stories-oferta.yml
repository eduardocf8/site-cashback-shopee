name: Stories de oferta ao longo do dia

# Separado de tarefas-diarias.yml de propósito: esse aqui roda várias vezes ao dia
# (não uma vez só), postando no máximo 1 story de oferta por chamada - ver
# instagram_bot/services.py (publicar_story_oferta_do_momento) e
# NUMERO_STORIES_OFERTAS_POR_DIA. A ideia é espalhar as ofertas ao longo do dia em vez
# de "bombardear" o Instagram com todas de uma vez - o perfil não é só sobre ofertas.

# Sem "schedule" de propósito (2026-08-28): o agendador gratuito do GitHub Actions
# atrasava demais pra esse repositório (às vezes várias horas) - migrado pra Cron Job
# do Render, que roda na mesma infra do site (novos horários: 08h, 10h, 15h, 18h, 20h
# no Brasil). Ver "Cron Jobs do Render" em marketing/instagram/README.md.
# workflow_dispatch continua aqui só pra disparo manual de emergência (ex: debug).

on:
  workflow_dispatch: {}

jobs:
  postar-story-oferta:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endereço de story de oferta do site
        run: |
          story_url=$(echo "${{ secrets.TAREFAS_URL }}" | sed 's#/tarefas/executar/#/tarefas/postar-story-oferta/#')
          curl -f -sS --retry 3 --retry-delay 15 --max-time 60 "$story_url"
