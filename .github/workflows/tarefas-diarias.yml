name: Tarefas diárias do site

# Roda de madrugada de propósito: essa tarefa mexe com dinheiro de gente de verdade
# (sincroniza pedidos, libera saldo, confere status de saques) - não faz sentido rodar
# num horário em que as pessoas podem estar usando o site. Os posts do Instagram têm
# workflow próprio (instagram-diario.yml), com um horário pensado pro alcance deles.

on:
  schedule:
    # 06:00 UTC = 03:00 no horário de Brasília.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  executar-tarefas:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endereço de tarefas agendadas do site
        run: |
          curl -f -sS --retry 3 --retry-delay 15 --max-time 300 "${{ secrets.TAREFAS_URL }}"
      # Chamada separada de propósito: a busca de ofertas na Shopee, sozinha, já usa boa
      # parte dos 120s de orçamento antes do timeout do gunicorn - enfileirar o
      # encurtamento de nomes via Gemini atrás dela na mesma requisição estourava esse
      # timeout quase toda vez. Essa chamada tem os 120s só pra si. continue-on-error
      # porque isso é só uma melhoria cosmética (nome mais curto) - uma falha aqui (ex:
      # cota do Gemini esgotada) não deve marcar a tarefa diária inteira como falha.
      - name: Encurtar nomes de ofertas pendentes (Gemini)
        continue-on-error: true
        run: |
          encurtar_url=$(echo "${{ secrets.TAREFAS_URL }}" | sed 's#/tarefas/executar/#/tarefas/encurtar-nomes/#')
          curl -f -sS --retry 3 --retry-delay 15 --max-time 300 "$encurtar_url"
