name: Tarefas diárias do site

on:
  schedule:
    # 14:00 UTC = 11:00 no horário de Brasília - horário melhor pro alcance
    # das postagens do bot do Instagram (madrugada tinha pouco engajamento).
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  executar-tarefas:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endereço de tarefas agendadas do site
        run: |
          curl -f -sS --retry 3 --retry-delay 15 --max-time 300 "${{ secrets.TAREFAS_URL }}"
