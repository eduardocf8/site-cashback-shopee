{% load static %}
<div class="prints" data-prints>
  {% if prints|length > 1 %}
  <div class="prints-abas" role="tablist" aria-label="Telas do painel">
    {% for p in prints %}<button type="button" role="tab" class="prints-aba{% if forloop.first %} ativa{% endif %}" data-i="{{ forloop.counter0 }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}">{{ p.aba }}</button>{% endfor %}
  </div>
  {% endif %}
  {% for p in prints %}
    <figure class="prints-painel{% if forloop.first %} ativo{% endif %}" data-i="{{ forloop.counter0 }}">
      <div class="prints-janela">
        <div class="prints-barra" aria-hidden="true"><i></i><i></i><i></i><span>app.appfiliado.com.br</span></div>
        <img src="{% static p.arquivo %}" width="{{ p.largura }}" height="{{ p.altura }}" alt="{{ p.alt }}"{% if not forloop.first %} loading="lazy"{% endif %} decoding="async">
      </div>
      <figcaption>{{ p.legenda }}</figcaption>
    </figure>
  {% endfor %}
  <p class="prints-nota">Telas reais do painel, com dados de exemplo.<span class="so-movel-nota"> Deslize a tela pro lado pra ver tudo.</span></p>
</div>
