{% load static %}
<div class="prints">
  {% for p in prints %}
    {% if p.celular == "editor" %}
    <figure class="prints-painel prints-combo">
      <div class="combo">
        <div class="prints-janela">
          <div class="prints-barra" aria-hidden="true"><i></i><i></i><i></i><span>app.appfiliado.com.br</span></div>
          <img src="{% static 'landing/prints/site-editor-form.webp' %}" width="712" height="1159" alt="Editor do Meu site: endereço, perfil, cores e redes sociais" loading="lazy" decoding="async">
        </div>
        <div class="combo-celular">
          <span class="combo-rotulo">Prévia</span>
          <img src="{% static p.arquivo %}" width="{{ p.largura }}" height="{{ p.altura }}" alt="{{ p.alt }}" loading="lazy" decoding="async">
        </div>
      </div>
      <figcaption>{{ p.legenda }}</figcaption>
    </figure>
    {% elif p.celular %}
    <figure class="prints-painel prints-anotado">
      <div class="anotado">
        <img src="{% static p.arquivo %}" width="{{ p.largura }}" height="{{ p.altura }}" alt="{{ p.alt }}" loading="lazy" decoding="async">
        <div class="anotado-lado">
          <p class="anotado-chapeu">O que o visitante vê</p>
          <ul>
            {% for n in p.anotacoes %}<li style="--y:{{ n.y }}%"><b>{{ n.titulo }}</b><span>{{ n.texto }}</span></li>{% endfor %}
          </ul>
        </div>
      </div>
      <figcaption>{{ p.legenda }}</figcaption>
    </figure>
    {% else %}
    <figure class="prints-painel">
      <div class="prints-janela">
        <div class="prints-barra" aria-hidden="true"><i></i><i></i><i></i><span>app.appfiliado.com.br</span></div>
        <picture>
          <source media="(max-width: 640px)" srcset="{% static p.arquivo_m %}" width="{{ p.largura_m }}" height="{{ p.altura_m }}">
          <img src="{% static p.arquivo %}" width="{{ p.largura }}" height="{{ p.altura }}" alt="{{ p.alt }}" loading="lazy" decoding="async">
        </picture>
      </div>
      <figcaption>{{ p.legenda }}</figcaption>
    </figure>
    {% endif %}
  {% endfor %}
</div>
