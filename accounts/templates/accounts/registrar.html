{% extends "accounts/base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="erros">{{ field.errors|striptags }}</div>{% endif %}
        {% endfor %}
        <button type="submit">Cadastrar</button>
    </form>
    <p class="rodape">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
