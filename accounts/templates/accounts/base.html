<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    <title>{% block titulo %}cash-b{% endblock %} — cash-b</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--paper-2); color: var(--ink); }
        .topo { text-align: center; padding: 40px 20px 0; }
        .topo a.marca { font-size: 22px; color: var(--brand); text-decoration: none; }
        .container { max-width: {% block largura_container %}420px{% endblock %}; margin: 24px auto 60px; background: var(--paper); padding: 32px; border-radius: 10px; border: 1px solid var(--line); }
        h1 { color: var(--ink); font-size: 22px; letter-spacing: -0.01em; }
        label { display: block; margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
        input, select {
            width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
            border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 14px;
        }
        input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        button {
            margin-top: 20px; width: 100%; padding: 10px; background: var(--brand); color: var(--paper);
            border: none; border-radius: 4px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
        }
        button:hover { background: var(--brand-strong); }
        .erros { color: var(--danger); font-size: 13px; }
        .legenda { color: var(--muted); font-size: 14px; }
        .rodape { text-align: center; margin-top: 16px; font-size: 14px; color: var(--ink-soft); }
        a { color: var(--brand); }
        .mensagens { list-style: none; padding: 0; margin: 0 0 16px 0; }
        .mensagens li { padding: 10px 12px; border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
        .mensagens li.success { background: var(--success-bg); color: var(--success); }
        .mensagens li.error { background: var(--danger-bg); color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line-soft); }
        .link-curto { word-break: break-all; }
        .nav-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
        h2.titulo-bloco { font-size: 16px; margin-top: 32px; }

        /* ---- layout dividido (login / cadastro) ---- */
        .split { display: flex; min-height: 100vh; }
        .split-form { flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
        .split-form-inner { width: 100%; max-width: 380px; }
        .split-marca { display: block; color: var(--brand); text-decoration: none; font-size: 22px; margin-bottom: 28px; }
        .split-graphic {
            flex: 1 1 55%; position: relative; overflow: hidden;
            background: linear-gradient(160deg, var(--brand-strong), var(--brand));
            display: flex; align-items: center; justify-content: center;
        }
        .grafico-svg { width: 62%; max-width: 320px; height: auto; }
        @media (max-width: 860px) {
            .split-graphic { display: none; }
            .split-form { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
    {% block layout %}
    <div class="topo"><a class="marca" href="{% url 'home' %}">cash-b</a></div>
    <div class="container">
        {% if messages %}
            <ul class="mensagens">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block conteudo %}{% endblock %}
    </div>
    {% endblock %}
</body>
</html>
