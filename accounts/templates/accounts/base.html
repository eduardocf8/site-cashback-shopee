<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Cashback Shopee{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: {% block largura_container %}420px{% endblock %}; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #ee4d2d; font-size: 22px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #ee4d2d; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: #d43f22; }
        .erros { color: #c0392b; font-size: 13px; }
        .rodape { text-align: center; margin-top: 16px; font-size: 14px; }
        a { color: #ee4d2d; }
        .mensagens { list-style: none; padding: 0; margin: 0 0 16px 0; }
        .mensagens li { padding: 10px 12px; border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
        .mensagens li.success { background: #e6f4ea; color: #1e7e34; }
        .mensagens li.error { background: #fdecea; color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        .link-curto { word-break: break-all; }
        .nav-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        {% if messages %}
            <ul class="mensagens">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block conteudo %}{% endblock %}
    </div>
</body>
</html>
