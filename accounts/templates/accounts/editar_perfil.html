{% extends "accounts/base.html" %}
{% block titulo %}Editar dados{% endblock %}
{% block conteudo %}
    <div class="nav-topo">
        <a href="{% url 'dashboard' %}">&larr; Voltar pro painel</a>
    </div>
    <h1>Editar dados cadastrais</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% include "accounts/_campo_formulario.html" with field=field %}
        {% endfor %}
        <button type="submit">Salvar alterações</button>
    </form>
{% endblock %}
