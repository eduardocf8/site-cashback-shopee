<label for="{{ field.id_for_label }}">{{ field.label }}</label>
{% if field.field.widget.input_type == "password" %}
    <div class="campo-senha">
        {{ field }}
        <button type="button" class="botao-olho" aria-label="Mostrar senha" data-mostrar="Mostrar senha" data-esconder="Esconder senha">
            <svg class="icone-olho-aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icone-olho-fechado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C3.8 8.4 1.5 12 1.5 12s3.5 7 10.5 7c2 0 3.7-.5 5.1-1.3M9.9 5.2C10.6 5.1 11.3 5 12 5c7 0 10.5 7 10.5 7-.6 1.2-1.5 2.6-2.8 3.9"/></svg>
        </button>
    </div>
{% else %}
    {{ field }}
{% endif %}
{% if field.errors %}<div class="erros">{{ field.errors|striptags }}</div>{% endif %}
