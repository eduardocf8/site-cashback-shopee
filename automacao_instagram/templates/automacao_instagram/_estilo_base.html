<style>
    :root {
        --ink: #322D29;
        --ink-soft: #5b4f47;
        --muted: #8f8478;
        --brand: #72383D;
        --brand-strong: #4a2226;
        --brand-soft: #f1e6e4;
        --accent: #AC9C8D;
        --paper: #ffffff;
        --paper-2: #EFE9E1;
        --shell: #322D29;
        --shell-soft: #4a423c;
        --shell-ink: #EFE9E1;
        --shell-muted: #b8ada2;
        --line: #e4ddd4;
        --line-soft: #eee8e1;
        --danger: #96402f;
        --danger-bg: #f2e2dc;
        --success: #4f6355;
        --success-bg: #e6ebe4;
        --shadow: 0 1px 2px rgba(50, 45, 41, 0.06), 0 8px 24px rgba(50, 45, 41, 0.06);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0; background: var(--paper-2); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    h1 { color: var(--ink); font-size: 21px; letter-spacing: -0.01em; margin: 0; }
    h2.titulo-bloco { font-size: 15px; margin: 32px 0 4px; color: var(--ink); font-weight: 600; }
    label { display: block; margin-top: 12px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
    input, select, textarea {
        width: 100%; max-width: 640px; padding: 9px 10px; margin-top: 5px; box-sizing: border-box;
        border: 1px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 14px;
        background: #fff; color: var(--ink);
    }
    input[type="checkbox"] { width: 18px; height: 18px; margin: 0; flex-shrink: 0; accent-color: var(--brand); }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    button, .botao {
        margin-top: 20px; width: 100%; max-width: 640px; padding: 10px 16px; background: var(--brand); color: #fff;
        border: none; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .12s ease;
    }
    button:hover, .botao:hover { background: var(--brand-strong); }
    .botao-secundario {
        background: transparent; color: var(--ink-soft); border: 1px solid var(--line); font-weight: 500;
    }
    .botao-secundario:hover { background: var(--paper-2); color: var(--ink); }
    .botao-perigo { background: var(--danger); }
    .botao-perigo:hover { background: #7a3326; }
    .botao-auto { width: auto; margin-top: 0; padding: 7px 14px; font-size: 13px; }
    .erros { color: var(--danger); font-size: 13px; }
    .legenda { color: var(--muted); font-size: 14px; line-height: 1.5; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: var(--paper-2); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
    .mensagens { list-style: none; padding: 0; margin: 0 0 20px 0; display: flex; flex-direction: column; gap: 8px; }
    .mensagens li { padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .mensagens li.success { background: var(--success-bg); color: var(--success); }
    .mensagens li.error { background: var(--danger-bg); color: var(--danger); }
    .mensagens li.info { background: var(--brand-soft); color: var(--brand-strong); }

    .pilula { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pilula::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pilula-ativa { background: var(--success-bg); color: var(--success); }
    .pilula-pausada { background: var(--line-soft); color: var(--muted); }

    .cabecalho-pagina { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .cabecalho-pagina .botao { margin-top: 0; }

    .grade-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .cartao-resumo { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
    .resumo-rotulo { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .resumo-valor { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
    .resumo-total { font-size: 15px; font-weight: 500; color: var(--muted); }

    .acoes-linha { display: flex; gap: 8px; flex-wrap: nowrap; }

    .campo-checkbox {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 640px;
        margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-2);
    }
    .campo-checkbox label { margin: 0; font-size: 14px; color: var(--ink); font-weight: 500; }

    .cartao { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 24px; }

    .tabela-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .tabela-scroll table { white-space: nowrap; }
    th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--line); }
    td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line-soft); }
    tbody tr:hover { background: var(--paper-2); }
    .badge-ok { color: var(--success); font-weight: 600; }
    .badge-erro { color: var(--danger); font-weight: 600; cursor: help; }

    .campo-senha { position: relative; max-width: 640px; }
    .campo-senha input { padding-right: 42px; }
    .botao-olho {
        position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
        width: auto; margin: 0; padding: 6px; background: none; border: none;
        color: var(--muted); display: flex; cursor: pointer;
    }
    .botao-olho:hover { color: var(--ink); background: none; }
    .icone-olho-fechado { display: none; }
    .botao-olho.mostrando .icone-olho-aberto { display: none; }
    .botao-olho.mostrando .icone-olho-fechado { display: block; }

    .icone { width: 17px; height: 17px; flex-shrink: 0; }
</style>
