<!doctype html>
<html>
<body style="margin:0; padding:0; background:#f1eefb; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1eefb; padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="100%" style="max-width:560px;" cellpadding="0" cellspacing="0">

<tr><td style="padding:0 16px 20px; text-align:center;">
    <span style="font-family:Arial, Helvetica, sans-serif; font-weight:bold; font-size:22px; color:#6d28d9;">cash-b</span>
</td></tr>

<tr><td style="background:#ffffff; border-radius:12px; padding:24px 20px; color:#111827; font-size:15px; line-height:1.6;">
    {{ corpo_html_intro|safe }}
</td></tr>

<tr><td style="padding:16px 4px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        {% for item in links %}
        <tr><td style="padding:6px 0;">
            <a href="{{ item.url }}" style="text-decoration:none; color:inherit; display:block; background:#ffffff; border:1px solid #e0dcef; border-radius:10px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
                    <td width="64" style="padding:12px;">
                        <img src="{{ item.icone_url }}" width="48" height="48" alt="" style="display:block; border-radius:8px;">
                    </td>
                    <td style="padding:12px 16px 12px 0; vertical-align:middle;">
                        <div style="font-size:14px; font-weight:bold; color:#111827;">{{ item.titulo }}</div>
                        <div style="font-size:13px; color:#6b7280; margin-top:2px;">{{ item.subtitulo }}</div>
                    </td>
                </tr></table>
            </a>
        </td></tr>
        {% endfor %}
    </table>
</td></tr>

<tr><td style="padding:24px 16px 0; text-align:center; font-size:12px; color:#6b7280;">
    Você recebeu esse e-mail porque tem uma conta na cash-b.
    {% if link_descadastro %}
        <br>
        <a href="{{ link_descadastro }}" style="color:#6b7280;">Não quer mais receber e-mails de promoções?</a>
    {% endif %}
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
